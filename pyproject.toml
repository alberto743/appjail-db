[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "appjail-db"
version = "0.1.0"
description = "Weekly appjail-catalog built from the ivan-hc/AM AppImage index"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSES/MPL-2.0.txt"]
dependencies = []  # standard library only, by design

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/appjail_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PL", "SIM", "UP", "B"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
# Bidirectional overrides and control characters are handled here on purpose.
"src/appjail_db/textsafe.py" = ["PLE2502"]
"tests/test_textsafe.py" = ["PLE2502"]
