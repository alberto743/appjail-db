version: 2
updates:
  # The workflow actions are pinned to a version tag (not a SHA); Dependabot proposes the newer versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # No runtime dependencies; this only tracks the build backend and the test tools declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
