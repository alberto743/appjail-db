name: Update catalog

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q

      # Refuses a catalog that is too small or shrinks by more than 10%; leaves the file alone when the apps are unchanged.
      - name: Build the catalog from ivan-hc/AM
        run: python3 -m appjail_db build -o catalog.json
        env:
          PYTHONPATH: src

      - name: Commit and push if the catalog changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog unchanged"
            exit 0
          fi
          rev=$(python3 -c "import json; print(json.load(open('catalog.json'))['revision'][:8])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "catalog: update from AM $rev"
          git push
